[project]
name = "materials-rag"
version = "0.1.0"
description = "Reproducible materials R&D retrieval and verified agentic RAG testbed"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Seifallah Elfetni" }]
keywords = [
    "retrieval-augmented-generation",
    "materials-science",
    "information-retrieval",
    "agentic-rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "huggingface-hub>=1.3,<2",
    "numpy>=2.0,<3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0,<7",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.1",
    "typer>=0.27.2",
]

[project.urls]
Repository = "https://github.com/SFETNI/materials-rag-lab"
Dataset = "https://doi.org/10.5281/zenodo.22837229"

[project.scripts]
materials-rag-lab = "materials_rag.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["data"]
