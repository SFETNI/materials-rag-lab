name: public-candidate-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: uv run python scripts/validate_public_candidate.py
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run python scripts/check_public_docs.py
      - run: uv run python scripts/verify_public_results.py
      - run: uv run materials-rag-lab doctor --json
